[package]
name = "heisenbug-cli"
version = "0.1.0"
edition = "2021"
authors = ["Heisenbug Contributors"]
description = "Command-line tool for deterministic race condition reproduction and minimization"

[[bin]]
name = "heisenbug"
path = "src/main.rs"

[dependencies]
heisenbug-core = { path = "../heisenbug-core" }
heisenbug-sim = { path = "../heisenbug-sim" }
heisenbug-ebpf = { path = "../heisenbug-ebpf" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
